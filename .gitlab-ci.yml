include:
  - component: gitlab.gnome.org/GNOME/citemplates/release-service@master
    inputs:
      dist-job-name: "dist-tarball"
      tarball-artifact-path: "public-dist"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED

stages:
  - build
  - abi
  - deploy

variables:
  FEDORA_DEPENDENCIES:
    gettext-devel
    gobject-introspection-devel
    gtk-doc
    util-linux
    texinfo-tex
  FEDORA_DEPENDENCIES_ABI_CHECK:
    libabigail
    intltool
  LAST_ABI_BREAK: "df6393ac"
  UBUNTU_DEPENDENCIES:
    automake
    autopoint
    gettext
    gtk-doc-tools
    libgirepository1.0-dev
    libtool
    make
    texinfo
    texlive

build-fedora:
  image: fedora:latest
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script:
    - dnf update -y --nogpgcheck
    - dnf install -y --nogpgcheck $FEDORA_DEPENDENCIES
  script:
    - mkdir _build
    - cd _build
    - ../autogen.sh --disable-dependency-tracking
    - make
    - make install
    - make distcheck

abi-fedora:
  image: fedora:latest
  stage: abi
  needs:
    - job: build-fedora
      optional: true
  before_script:
    - dnf update -y --nogpgcheck
    - dnf install -y --nogpgcheck $FEDORA_DEPENDENCIES $FEDORA_DEPENDENCIES_ABI_CHECK
  script:
    - curl https://gitlab.freedesktop.org/hadess/check-abi/-/raw/main/contrib/check-abi-fedora.sh | bash
    - check-abi ${LAST_ABI_BREAK} $(git rev-parse HEAD)

build-ubuntu:
  image: ubuntu:latest
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y $UBUNTU_DEPENDENCIES
  script:
    - mkdir _build
    - cd _build
    - ../autogen.sh
    - make
    - make install
    - make distcheck

dist-tarball:
  image: fedora:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED
  needs:
    - abi-fedora
  before_script:
    - dnf update -y --nogpgcheck
    - dnf install -y --nogpgcheck $FEDORA_DEPENDENCIES
  script:
    - mkdir _build
    - cd _build
    - ../autogen.sh --disable-dependency-tracking
    - make distcheck
    - mkdir -p "$CI_PROJECT_DIR/public-dist"
    - mv libgtop-*.tar.xz "$CI_PROJECT_DIR/public-dist/"
    - cd "$CI_PROJECT_DIR/public-dist"
    - for tarball in *.tar.xz; do sha256sum "$tarball" > "$tarball.sha256sum"; done
  artifacts:
    paths:
      - public-dist/
